name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

      - name: Build portable executable
        run: uv run pyinstaller --noconfirm --clean packaging/windows.spec

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PDFPageScreenshotCapture-windows
          path: dist/PDFPageScreenshotCapture.exe
          if-no-files-found: error
